[package]
name = "xcpclient"
version = "2.1.3"
edition = "2024"
resolver = "2"
authors = ["RainerZ"]
description = "Simple XCP test client and ELF/A2L utilities"
readme = "README.md"
keywords = ["XCP","ASAM","CANape","A2L"]
license = "MIT"
homepage = "https://vector.com"  
repository = "https://github.com/vectorgrp/XCPlite"
categories = ["measurement and calibration"] 

 # more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.32"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
lazy_static = "1.5"
byteorder = "1.5.0"
bytes = "1.11.1"
regex = "1.12.3"
chrono = "0.4.45"
parking_lot = "0.12.5"
tokio = { version = "1.52", features = ["full"] }
ihex = "3.0"

# ELF/DWARF Debug info parsing dependencies
gimli = "0.28"  # 0.29+ has breaking API changes in attr_value (Option vs Result)
object = "0.36" # keep in sync with gimli
pdb2 = "0.10"
memmap2 = "0.9"
indexmap = "2.14"
cpp_demangle = "0.4"  # 0.5 removed DemangleOptions, would require code changes


# xcp_registry from xcp-lite on Github
# xcp_registry = { git = "https://github.com/RainerZ/xcp-lite.git", branch = "V2.1.0", features = ["a2l_reader"] }

# xcp_registry local
xcp_registry = { path = "../../../xcp-lite-RainerZ/xcp_registry", features = ["a2l_reader"] } # temporary local path


[lints.rust]
dead_code = "allow"
unused_variables = "allow"

[build-dependencies]





