[package]
name = "xcpclient"
version = "4.0.0"
edition = "2024"
resolver = "2"
authors = ["RainerZ"]
description = "Simple XCP test client and ELF/A2L utilities"
readme = "README.md"
keywords = ["XCP","ASAM","CANape","A2L"]
license = "MIT"  
repository = "https://github.com/vectorgrp/XCPlite"
categories = ["measurement and calibration"] 

 # more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.32"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
lazy_static = "1.5"
byteorder = "1.5.0"
bytes = "1.11.1"
regex = "1.12.3"
chrono = "0.4.45"
parking_lot = "0.12.5"
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml"] }
ihex = "3.0"

# ELF/DWARF Debug info parsing dependencies
object = { version = "0.39", default-features = false, features = ["read"] }
gimli = { version = "0.34", default-features = false, features = ["read"] }
memmap2 = "0.9"
indexmap = "2.14"
cpp_demangle = "0.5" 

# Registry
# From VectorGrp/xcp-lite
xcp_registry = { git = "https://github.com/vectorgrp/xcp-lite", features = ["a2l_reader"] }
# From fork RainerZ/xcp-lite V3.0.9
# xcp_registry = { git = "https://github.com/RainerZ/xcp-lite.git", branch = "V3.0.9", features = ["a2l_reader"] }
# From local directory current branch
# xcp_registry = { path = "../../../xcp-lite-RainerZ/xcp_registry", features = ["a2l_reader"] } 


[lints.rust]
dead_code = "allow"
unused_variables = "allow"

[build-dependencies]





